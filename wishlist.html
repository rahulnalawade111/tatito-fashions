<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addresses | Tatito Fashions</title>
  <link rel="icon" href="assets/images/favicon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=57" />
</head>
<body data-page="addresses">
  <header class="navbar"></header>
  <main class="page-shell">
    <div class="breadcrumb">
      <a href="index.html" data-i18n="breadcrumbHome">Home</a>
      <span class="sep">/</span>
      <a href="profile.html" data-i18n="profileTitle">My Profile</a>
      <span class="sep">/</span>
      <span data-i18n="addressesTitle">Address Book</span>
    </div>
    <div class="category-hero" style="margin-bottom:24px;">
      <div>
        <p class="eyebrow" data-i18n="addressesTitle">Address Book</p>
        <h1 data-i18n="addressesTitle">Address Book</h1>
        <p data-i18n="addressesDesc">Manage your shipping and billing addresses.</p>
      </div>
      <div class="hero-card">
        <h3 data-i18n="addAddress">Add Address</h3>
        <p data-i18n="addressesDesc">Manage your shipping and billing addresses.</p>
        <button class="btn btn-primary" id="addAddressBtn" data-i18n="addAddress">Add Address</button>
      </div>
    </div>
    <div id="addressGrid" class="address-grid"></div>
  </main>
  <footer class="footer"></footer>
  <div id="shopToast" class="shop-toast"></div>

  <!-- Address modal -->
  <div id="addressModal" class="modal-overlay hidden">
    <div class="modal-box" style="position:relative;">
      <span class="modal-close" id="addressModalClose">&times;</span>
      <h3 id="addressModalTitle" data-i18n="addAddress">Add Address</h3>
      <form id="addressForm">
        <input type="hidden" id="addressId" />
        <div class="form-row">
          <div class="form-field">
            <label data-i18n="fullName">Full name</label>
            <input type="text" id="addrFullName" required />
          </div>
          <div class="form-field">
            <label data-i18n="phone">Phone</label>
            <input type="tel" id="addrPhone" required />
          </div>
        </div>
        <div class="form-field">
          <label data-i18n="addressLine1">Address Line 1</label>
          <input type="text" id="addrLine1" required />
        </div>
        <div class="form-field">
          <label data-i18n="addressLine2">Address Line 2 (optional)</label>
          <input type="text" id="addrLine2" />
        </div>
        <div class="form-row">
          <div class="form-field">
            <label data-i18n="city">City</label>
            <input type="text" id="addrCity" required />
          </div>
          <div class="form-field">
            <label data-i18n="state">State</label>
            <input type="text" id="addrState" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label data-i18n="pincode">Pincode</label>
            <input type="text" id="addrPincode" required />
          </div>
          <div class="form-field">
            <label data-i18n="addressType">Address Type</label>
            <select id="addrType">
              <option value="home" data-i18n="home">Home</option>
              <option value="work" data-i18n="work">Work</option>
              <option value="other" data-i18n="other">Other</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary block" data-i18n="saveChanges">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="js/data.js?v=57"></script>
  <script src="js/translations.js?v=57"></script>
  <script src="js/store.js?v=57"></script>
  <script src="js/location-gmaps.js?v=57"></script>
  <script src="js/app.js?v=57"></script>
  <script src="js/profile.js?v=57"></script>
</body>
</html>

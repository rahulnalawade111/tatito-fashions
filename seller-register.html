<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Registration | Tatito Fashions</title>
  <link rel="icon" href="assets/images/favicon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=57" />
</head>
<body data-page="seller-register">
  <header class="navbar"></header>
  <main class="page-shell">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span class="sep">/</span>
      <a href="about.html">Sell on Tatito</a>
      <span class="sep">/</span>
      <span>Seller Registration</span>
    </div>

    <!-- Hero banner -->
    <section class="seller-hero" style="background:linear-gradient(135deg,rgba(26,18,15,0.85),rgba(90,10,24,0.75)),url('https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=1600&q=80');background-size:cover;background-position:center;border-radius:20px;padding:40px 28px;margin-bottom:28px;text-align:center;">
      <h1 style="font-family:var(--font-display);font-size:36px;color:#fff;margin-bottom:8px;">Become a Tatito Seller</h1>
      <p style="font-size:16px;color:rgba(255,255,255,0.88);max-width:560px;margin:0 auto;">Join 2,400+ vendors selling fashion, jewellery, and services on India's premium fashion marketplace.</p>
      <div style="display:flex;gap:24px;justify-content:center;margin-top:18px;flex-wrap:wrap;">
        <div style="text-align:center;"><div style="font-size:26px;font-weight:700;color:var(--gold);font-family:var(--font-display);">₹0</div><div style="font-size:12px;color:rgba(255,255,255,0.7);">Listing Fee</div></div>
        <div style="text-align:center;"><div style="font-size:26px;font-weight:700;color:var(--gold);font-family:var(--font-display);">5%</div><div style="font-size:12px;color:rgba(255,255,255,0.7);">Commission Only</div></div>
        <div style="text-align:center;"><div style="font-size:26px;font-weight:700;color:var(--gold);font-family:var(--font-display);">48h</div><div style="font-size:12px;color:rgba(255,255,255,0.7);">Approval Time</div></div>
      </div>
    </section>

    <div class="auth-page">
      <div class="auth-card" style="max-width:640px;">
        <!-- Step indicator -->
        <div id="sellerStepIndicator" style="display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:28px;"></div>
        <div id="sellerFormContainer"></div>
      </div>
    </div>
  </main>
  <footer class="footer"></footer>
  <div id="shopToast" class="shop-toast"></div>

  <script src="js/data.js?v=57"></script>
  <script src="js/translations.js?v=57"></script>
  <script src="js/store.js?v=57"></script>
  <script src="js/location-gmaps.js?v=57"></script>
  <script src="js/app.js?v=57"></script>
  <script src="js/seller.js?v=57"></script>
</body>
</html>

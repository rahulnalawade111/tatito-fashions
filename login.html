<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Tatito Fashions</title>
  <meta name="description" content="Sign in to Tatito Fashions to save favorites and continue browsing." />
  <link rel="icon" href="assets/images/favicon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=57" />
</head>
<body>
  <header class="navbar"></header>

  <div id="loginLogoIntro" class="login-logo-intro">
    <div class="brand-plate">
      <img src="assets/images/tatito-logo-official.jpg" alt="Tatito Fashions" />
      <div class="brand-name">
        <span class="brand-title">TATITO</span>
        <em class="brand-sub">FASHIONS</em>
      </div>
    </div>
  </div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/images/tatito-logo-official.jpg" alt="Tatito Fashions" />
        <div class="brand-name">
          <span class="brand-title">TATITO</span>
          <em class="brand-sub">FASHIONS</em>
        </div>
      </div>
      <div class="auth-tabs">
        <a href="login.html" class="auth-tab active">Login</a>
        <a href="register.html" class="auth-tab">Register</a>
      </div>

      <!-- Login method tabs -->
      <div class="auth-method-tabs" style="display:flex;gap:0;margin-bottom:18px;background:var(--ivory);border-radius:12px;padding:4px;">
        <button id="loginEmailTab" class="auth-method-tab active" style="flex:1;padding:10px;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--white);color:var(--gold-deep);transition:all .2s;">📧 Email</button>
        <button id="loginMobileTab" class="auth-method-tab" style="flex:1;padding:10px;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);transition:all .2s;">📱 Mobile</button>
      </div>

      <p class="eyebrow" style="text-align:center;margin-bottom:8px;">Welcome back</p>
      <h1>Login to Tatito</h1>

      <form id="loginForm" class="auth-form">
        <!-- Email fields -->
        <div id="loginEmailFields">
          <label>
            <span>Email</span>
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" placeholder="Enter your password" required />
          </label>
          <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Mobile fields -->
        <div id="loginMobileFields" style="display:none;">
          <label>
            <span>Mobile Number</span>
            <div style="display:flex;gap:8px;">
              <select id="loginCountryCode" style="border:1px solid var(--line);border-radius:12px;background:var(--ivory);font-size:14px;font-weight:600;color:var(--muted);padding:0 8px;cursor:pointer;outline:none;">
                <option value="+91">🇮🇳 +91</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+65">🇸🇬 +65</option>
                <option value="+61">🇦🇺 +61</option>
                <option value="+966">🇸🇦 +966</option>
                <option value="+880">🇧🇩 +880</option>
                <option value="+92">🇵🇰 +92</option>
                <option value="+94">🇱🇰 +94</option>
                <option value="+977">🇳🇵 +977</option>
                <option value="+60">🇲🇾 +60</option>
              </select>
              <input type="tel" id="loginMobile" name="mobile" placeholder="98765 43210" maxlength="10" style="flex:1;" />
            </div>
          </label>
          <button type="button" id="sendMobileOtpBtn" class="btn btn-ghost small" style="margin-bottom:12px;">Send OTP</button>
          <div id="mobileOtpField" style="display:none;">
            <label>
              <span>Enter OTP</span>
              <input type="text" name="mobileOtp" placeholder="6-digit code" maxlength="6" />
            </label>
            <button type="button" id="resendOtpBtn" class="btn btn-ghost small" style="font-size:12px;margin-top:4px;">Resend OTP</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary block">Login</button>
      </form>
      <p class="auth-switch"><span>New here?</span> <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <div id="shopToast" class="shop-toast"></div>

  <!-- Forgot Password Modal -->
  <div id="forgotPwdModal" class="overlay hidden">
    <div class="modal" style="max-width:440px;">
      <button id="forgotPwdClose" class="city-close" aria-label="Close" style="position:absolute;top:12px;right:14px;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;">&times;</button>
      <div style="text-align:center;margin-bottom:20px;">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--champagne);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="#C9A24B"/></svg>
        </div>
        <h2 style="font-family:var(--font-display);font-size:22px;margin-bottom:6px;">Reset Password</h2>
        <p style="font-size:14px;color:var(--muted);">Enter your registered email or mobile and we'll send a reset link.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:var(--text);">
          <span>Email or Mobile</span>
          <input type="text" id="forgotPwdInput" placeholder="you@example.com / 98765 43210" class="auth-form-input-dark" />
        </label>
        <button id="forgotPwdSubmit" class="btn btn-primary block">Send Reset Link →</button>
        <p id="forgotPwdStatus" class="forgot-status"></p>
      </div>
    </div>
  </div>
  <script src="js/data.js?v=57"></script>
  <script src="js/translations.js?v=57"></script>
  <script src="js/store.js?v=57"></script>
  <script src="js/location-gmaps.js?v=57"></script>
  <script src="js/app.js?v=57"></script>
  <script src="js/auth.js?v=57"></script>
</body>
</html>
